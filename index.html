<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141E30">
<title>Skyward Weather</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg1:#243B55;--bg2:#141E30;--card:rgba(255,255,255,.07);--txt:#EAF2FB;--dim:#8FAECF;--dim2:#B9D2EC;--blue:#4A90D9;--alert:#E4572E}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,'SF Pro Display','Segoe UI',Roboto,sans-serif;background:var(--bg2);color:var(--txt);display:flex;justify-content:center}
#app{width:100%;max-width:520px;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(175deg,var(--bg1),var(--bg2));overflow:hidden;position:relative;
  padding-top:env(safe-area-inset-top)}
#locBtn{cursor:pointer}
.sheet{position:absolute;inset:0;z-index:40;background:linear-gradient(175deg,#1E3049,var(--bg2));display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);animation:up .22s ease}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.sheet[hidden]{display:none}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 8px;font-size:17px;font-weight:600}
.loclist{flex:1;overflow-y:auto;padding:6px 12px 18px;scrollbar-width:none}
.loclist::-webkit-scrollbar{display:none}
.locrow{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:14px;cursor:pointer;margin-bottom:4px}
.locrow:active,.locrow.sel{background:var(--card)}
.locrow .nm{flex:1;min-width:0}
.locrow .nm b{font-size:15px;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.locrow .nm span{font-size:11.5px;color:var(--dim)}
.locrow .wx{font-size:15px;display:flex;align-items:center;gap:7px;color:var(--dim2);flex-shrink:0}
.locrow .del{background:none;border:none;color:#7E9CBE;font-size:14px;padding:6px 8px;cursor:pointer;flex-shrink:0}
.locrow .del:active{color:var(--alert)}
/* Cover display mode: <380px wide (3.4" screen) */
.head{padding:14px 18px 6px;display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0}
.head h1{font-size:17px;font-weight:600;letter-spacing:.01em}
.head .loc{font-size:13px;color:var(--dim2);margin-top:2px}
.hbtns{display:flex;gap:8px}
.icon-btn{background:rgba(255,255,255,.1);border:none;color:#CBDDF2;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px}
.icon-btn:active{background:rgba(255,255,255,.22)}
#installBtn{display:none;background:var(--blue);color:#fff}
.searchrow{display:flex;gap:8px;padding:6px 18px;flex-shrink:0}
.searchrow input{flex:1;padding:9px 14px;border-radius:10px;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:14px;outline:none}
.searchrow input::placeholder{color:#87A5C6}
.searchrow button{padding:9px 16px;border:none;border-radius:10px;background:var(--blue);color:#fff;font-size:14px;cursor:pointer}
.sugg{margin:0 18px;background:#1E2C42;border-radius:12px;overflow:hidden;flex-shrink:0;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.sugg:empty{display:none}
.sugg .it{padding:11px 14px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.06)}
.sugg .it:last-child{border-bottom:none}
.sugg .it:active{background:rgba(255,255,255,.08)}
.sugg .it .sub{font-size:11.5px;color:var(--dim);text-align:right;flex-shrink:0}
.sugg .none{padding:11px 14px;font-size:12.5px;color:var(--dim)}
.alert{margin:2px 18px 6px;padding:10px 13px;border-radius:12px;background:rgba(228,87,46,.22);border-left:3px solid var(--alert);font-size:12.5px;line-height:1.45;flex-shrink:0}
.alert b{display:block;font-size:13px}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:8px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.hero{text-align:center;padding:16px 18px 10px}
.hero .ic{font-size:52px}
.hero .big{font-size:84px;font-weight:300;line-height:1;letter-spacing:-.03em}
.hero .cond{font-size:18px;color:#C6DAF0;margin-top:4px}
.hero .feels{font-size:13.5px;color:var(--dim);margin-top:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:8px 18px}
.card{background:var(--card);border-radius:14px;padding:12px 14px}
.card .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.card .v{font-size:19px;font-weight:500;margin-top:4px}
.card .s{font-size:11px;color:var(--dim);margin-top:2px}
.sect{padding:14px 18px 6px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.hstrip{display:flex;gap:9px;overflow-x:auto;padding:4px 18px 10px;scrollbar-width:none}
.hstrip::-webkit-scrollbar{display:none}
.hcell{flex-shrink:0;text-align:center;background:var(--card);border-radius:14px;padding:11px 12px;min-width:62px}
.hcell .t{font-size:11px;color:var(--dim)}
.hcell .i{font-size:22px;margin:4px 0}
.hcell .d{font-size:16px;font-weight:500}
.hcell .p{font-size:10.5px;color:#7FD4FF;margin-top:3px;min-height:13px}
.day{display:grid;grid-template-columns:52px 30px 34px 1fr 34px;align-items:center;gap:9px;padding:10px 18px;font-size:14.5px}
.day .lo{color:var(--dim);font-size:13.5px;text-align:right}
.day .hi{text-align:right}
.day .pp{font-size:10px;color:#7FD4FF}
.tbar{height:5px;border-radius:3px;background:rgba(255,255,255,.12);position:relative}
.tbar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#4A90D9,#F2C14E)}
.radarbox{margin:6px 18px 10px;border-radius:16px;overflow:hidden;position:relative;background:#0b1420;aspect-ratio:1/1}
.radarbox canvas{width:100%;height:100%;display:block}
.rhud{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.rhud button{background:rgba(255,255,255,.16);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:13px}
.rhud .ts{font-size:11px;color:#BFE3FF;flex:1;font-variant-numeric:tabular-nums}
.rhud input[type=range]{width:110px;accent-color:var(--blue)}
.rstatus{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px;text-align:center;padding:20px}
.legend{display:flex;gap:2px;align-items:center;margin:0 18px 12px;font-size:10px;color:var(--dim)}
.legend i{height:6px;flex:1;display:block}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(255,255,255,.1);flex-shrink:0;background:rgba(0,0,0,.28);
  padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:none;color:#7E9CBE;padding:10px 0 11px;font-size:10.5px;cursor:pointer;letter-spacing:.03em}
.tabs button .ic{display:block;font-size:19px;margin-bottom:3px}
.tabs button.on{color:#fff}
.note{text-align:center;font-size:11px;color:#5E7A9C;padding:8px 18px}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(175deg,var(--bg1),var(--bg2));z-index:30;font-size:14px;color:#A9C4E2}
.spin{width:28px;height:28px;border:2.5px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes slideL{from{transform:translateX(28px);opacity:.35}}
@keyframes slideR{from{transform:translateX(-28px);opacity:.35}}
.offline{background:rgba(242,193,78,.15);color:#F2C14E;font-size:11.5px;text-align:center;padding:5px;flex-shrink:0}
/* Cover display (Z Flip 6 front screen, ~277px). Placed LAST: media queries add no
   specificity, so these must come after the base rules to actually win. */
@media(max-width:339px) and (max-height:419px){
  #app{max-width:100%;padding-top:max(env(safe-area-inset-top),8px)}
  .head{padding:8px 10px 4px;display:flex;flex-direction:column;gap:2px}
  .head h1{font-size:14px}
  .head .loc{font-size:11px}
  .hbtns{gap:6px}
  .icon-btn{width:30px;height:30px;font-size:13px}
  #alertSlot{display:none!important}
  .sheet-head{padding:10px 12px 6px;font-size:14px}
  .locrow{padding:9px 8px}
  .locrow .nm b{font-size:13px}
  .body{padding:6px}
  .hero{padding:8px 10px 6px}
  .hero .ic{font-size:40px}
  .hero .big{font-size:56px;letter-spacing:-.02em}
  .hero .cond{font-size:13px;margin-top:2px}
  .hero .feels{font-size:11px}
  .grid{grid-template-columns:1fr 1fr;gap:6px;padding:6px 10px}
  .card{padding:8px 10px}
  .card .k{font-size:9px}
  .card .v{font-size:14px}
  .sect{padding:8px 10px 4px;font-size:9px}
  .hstrip{padding:2px 10px 8px;gap:6px}
  .hcell{min-width:48px;padding:7px 8px}
  .hcell .t{font-size:9px}
  .hcell .i{font-size:18px;margin:2px 0}
  .hcell .d{font-size:13px}
  .hcell .p{font-size:9px}
  .day{grid-template-columns:40px 24px 28px 1fr 28px;gap:6px;padding:7px 10px;font-size:12px}
  .day .lo{font-size:11px}
  .day .pp{font-size:9px}
  .tabs{display:none}
  .note{font-size:10px;padding:6px 10px}
}

/* Wide layouts. Placed LAST in the stylesheet so these overrides actually win.
   Fold 8 inner display MEASURED on device: 932x616 CSS px (DPR 2.625) — LANDSCAPE, ~540px usable height.
   600-779px: tablets/portrait — 2 columns, radar full-width below, height-capped.
   780px+:    Fold 8 (932 measured) & Fold 8 Ultra inner — 3 columns: Now | Hourly+10-day | Radar. */
@media(min-width:600px) and (min-height:500px){
  #app{max-width:100%}
  .head{padding:14px 22px 6px}
  .head h1{font-size:19px}
  .icon-btn{width:38px;height:38px;font-size:16px}
  .body{padding:0 8px 12px}
  .dash{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:start}
  .col{min-width:0}
  .dash .col:nth-child(3){grid-column:1/-1}
  .tabs{display:none}
  .hstrip{flex-wrap:wrap;row-gap:8px}
  .radarbox{width:min(100%,58vh);margin:6px auto 8px}
  .sheet{max-width:560px;left:50%;transform:translateX(-50%)}
  .alert{margin:2px 22px 6px}
}
@media(min-width:780px) and (min-height:500px){
  .dash{grid-template-columns:1.05fr 1.15fr 1fr;gap:8px}
  .dash .col:nth-child(3){grid-column:auto}
  .hero{padding:6px 14px 4px}
  .hero .ic{font-size:44px}
  .hero .big{font-size:78px}
  .hero .cond{font-size:16px}
  .hero .feels{font-size:12.5px}
  .grid{gap:7px;padding:6px 14px}
  .card{padding:9px 12px}
  .card .v{font-size:17px}
  .sect{padding:8px 14px 4px}
  .hcell{min-width:54px;padding:8px 9px}
  .day{padding:7px 14px;font-size:13.5px}
  .radarbox{width:100%;margin:6px 6px 8px}
  .note{padding:4px 14px}
}
</style>
</head>
<body>
<div id="app">
  <div class="loading" id="loading"><div class="spin"></div><div id="loadMsg">Finding you…</div><div style="font-size:11px;color:#5E7A9C">v2.2.0</div></div>
  <div class="offline" id="offlineBar" style="display:none">Offline — showing last saved forecast</div>
  <div class="head">
    <div id="locBtn"><h1>Skyward</h1><div class="loc" id="locName">— ▾</div></div>
    <div class="hbtns">
      <button class="icon-btn" id="installBtn" title="Install app">⬇</button>
      <button class="icon-btn" id="btnSearch" title="Locations">📍</button>
      <button class="icon-btn" id="btnRefresh" title="Refresh">⟳</button>
    </div>
  </div>
  <div id="alertSlot"></div>
  <div class="body" id="body"></div>
  <div class="tabs" id="tabs"></div>
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-head"><span>Locations</span><button class="icon-btn" id="sheetClose">✕</button></div>
    <div class="searchrow">
      <input id="searchInput" placeholder="Search a city…" autocomplete="off">
      <button id="searchGo">Add</button>
    </div>
    <div class="sugg" id="suggBox"></div>
    <div class="loclist" id="locList"></div>
  </div>
  <div class="sheet" id="diag" hidden>
    <div class="sheet-head"><span>Diagnostics</span><button class="icon-btn" id="diagClose">✕</button></div>
    <div style="display:flex;gap:8px;padding:0 18px 10px">
      <button id="diagRun" style="flex:1;padding:10px;border:none;border-radius:10px;background:var(--blue);color:#fff;font-size:14px;cursor:pointer">Run checks</button>
      <button id="diagCopy" style="flex:1;padding:10px;border:none;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-size:14px;cursor:pointer">Copy report</button>
    </div>
    <pre id="diagOut" style="flex:1;overflow:auto;margin:0 18px 18px;padding:14px;background:rgba(0,0,0,.35);border-radius:12px;font-size:11.5px;line-height:1.55;white-space:pre-wrap;font-family:ui-monospace,monospace;color:#C9DDF2">Tap “Run checks”, then “Copy report” and paste it to Claude.</pre>
  </div>
</div>

<script>
const VERSION='2.2.0';
console.log('Skyward Weather v'+VERSION);

/* ================= WEATHER CODES — day/night aware ================= */
const WMO={0:['Clear','☀️','🌙'],1:['Mostly clear','🌤️','🌙'],2:['Partly cloudy','⛅','☁️'],3:['Overcast','☁️','☁️'],
45:['Fog','🌫️','🌫️'],48:['Rime fog','🌫️','🌫️'],51:['Light drizzle','🌦️','🌧️'],53:['Drizzle','🌦️','🌧️'],55:['Heavy drizzle','🌧️','🌧️'],
61:['Light rain','🌧️','🌧️'],63:['Rain','🌧️','🌧️'],65:['Heavy rain','🌧️','🌧️'],66:['Freezing rain','🌧️','🌧️'],67:['Freezing rain','🌧️','🌧️'],
71:['Light snow','🌨️','🌨️'],73:['Snow','🌨️','🌨️'],75:['Heavy snow','❄️','❄️'],77:['Snow grains','🌨️','🌨️'],
80:['Showers','🌦️','🌧️'],81:['Showers','🌧️','🌧️'],82:['Violent showers','⛈️','⛈️'],85:['Snow showers','🌨️','🌨️'],86:['Snow showers','❄️','❄️'],
95:['Thunderstorm','⛈️','⛈️'],96:['T-storm + hail','⛈️','⛈️'],99:['T-storm + hail','⛈️','⛈️']};
const cond=(c,isDay=1)=>{const w=WMO[c]||['—','🌡️','🌡️'];return{text:w[0],icon:isDay?w[1]:w[2]};};

/* ================= STORAGE (persistent, guarded) ================= */
const store={
  get(k,d){try{const v=localStorage.getItem('sky:'+k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('sky:'+k,JSON.stringify(v));}catch(e){}}
};
const mem=new Map();
const cget=k=>{const e=mem.get(k);return(e&&e.exp>Date.now())?e.v:null;};
const cset=(k,v,ttl)=>mem.set(k,{v,exp:Date.now()+ttl});

/* ================= STATE ================= */
const S={
  locations:store.get('locs',[{id:'here',name:'My Location',lat:null,lon:null,isGPS:true}]),
  sel:'here',tab:'now',wx:null,alerts:[],wide:false,
  radar:{frames:[],idx:0,playing:true,tiles:{},base:[],ready:false,fail:'',z:7}
};
const $=id=>document.getElementById(id);

/* ================= DATA ================= */
async function fetchWeather(lat,lon,name){
  const key=`wx:${lat.toFixed(3)},${lon.toFixed(3)}`;
  const hit=cget(key); if(hit) return {...hit,location:name,fromCache:true};
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`+
    `&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,uv_index,is_day`+
    `&hourly=temperature_2m,precipitation_probability,weather_code,is_day`+
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset`+
    `&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=10`);
  if(!r.ok) throw new Error('weather HTTP '+r.status);
  const d=await r.json();
  // BUG FIX: compare against the LOCATION's local time (d.current.time), not device time —
  // otherwise the hourly strip is offset by the timezone difference for remote cities
  const nowIdx=Math.max(0,d.hourly.time.findIndex(t=>t>=d.current.time)-1);
  const wx={lat,lon,location:name,updated:Date.now(),
    current:{temp:Math.round(d.current.temperature_2m),feels:Math.round(d.current.apparent_temperature),
      hum:d.current.relative_humidity_2m,wind:Math.round(d.current.wind_speed_10m),
      precip:d.current.precipitation,uv:d.current.uv_index??0,
      c:cond(d.current.weather_code,d.current.is_day)},
    hourly:d.hourly.time.slice(nowIdx,nowIdx+24).map((t,i)=>{const j=nowIdx+i;return{
      t,temp:Math.round(d.hourly.temperature_2m[j]),p:d.hourly.precipitation_probability[j]??0,
      c:cond(d.hourly.weather_code[j],d.hourly.is_day[j])};}),
    daily:d.daily.time.map((t,i)=>({t,hi:Math.round(d.daily.temperature_2m_max[i]),lo:Math.round(d.daily.temperature_2m_min[i]),
      p:d.daily.precipitation_probability_max?.[i]??0,c:cond(d.daily.weather_code[i],1)})),
    sunrise:d.daily.sunrise[0],sunset:d.daily.sunset[0]};
  cset(key,wx,6e5);
  store.set('last:'+key,wx);               // persistent offline copy
  return wx;
}
async function fetchAlerts(lat,lon){
  try{const r=await fetch(`https://api.weather.gov/alerts/active?point=${lat.toFixed(4)},${lon.toFixed(4)}`,{headers:{Accept:'application/geo+json'}});
    if(!r.ok) return [];
    const j=await r.json();
    return (j.features||[]).slice(0,2).map(f=>({event:f.properties.event,head:f.properties.headline||''}));
  }catch(e){return [];}
}
async function suggest(q){
  const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en&format=json`);
  const j=await r.json();
  return (j.results||[]).map(x=>({name:x.name,sub:[x.admin1,x.country].filter(Boolean).join(', '),lat:x.latitude,lon:x.longitude}));
}

/* ================= RADAR — CORS-safe basemap, true centering, precache ================= */
async function bmp(url){const r=await fetch(url);if(!r.ok)throw 0;return createImageBitmap(await r.blob());}
function mercator(lat,lon,z){const n=2**z;return{xf:(lon+180)/360*n,yf:(1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*n};}

let radarToken=0;
async function loadRadar(lat,lon){
  const tok=++radarToken;   // BUG FIX: guard against race when switching cities quickly
  const R=S.radar; R.ready=false; R.fail=''; R.tiles={}; R.base=[]; R.frames=[];
  try{
    const meta=await (await fetch('https://api.rainviewer.com/public/weather-maps.json')).json();
    R.frames=[...(meta.radar?.past||[]).slice(-7),...(meta.radar?.nowcast||[]).slice(0,3)];
    if(!R.frames.length) throw new Error('no frames');
    const z=R.z,{xf,yf}=mercator(lat,lon,z); R.xf=xf; R.yf=yf;
    const tx0=Math.floor(xf)-1, ty0=Math.floor(yf)-1;
    const jobs=[];
    for(let dx=0;dx<3;dx++)for(let dy=0;dy<3;dy++){
      const tx=tx0+dx,ty=ty0+dy;
      jobs.push(bmp(`https://basemaps.cartocdn.com/dark_all/${z}/${tx}/${ty}.png`)
        .then(im=>R.base.push({im,tx,ty})).catch(()=>{}));   // basemap optional — radar draws without it
      R.frames.forEach(f=>{
        jobs.push(bmp(`${meta.host}${f.path}/256/${z}/${tx}/${ty}/4/1_1.png`)
          .then(im=>{(R.tiles[f.time]=R.tiles[f.time]||[]).push({im,tx,ty});}).catch(()=>{}));
      });
    }
    await Promise.all(jobs);
    if(tok!==radarToken) return;   // a newer load superseded this one — discard
    const withTiles=R.frames.filter(f=>(R.tiles[f.time]||[]).length>0);
    if(!withTiles.length) throw new Error('tiles blocked');
    R.frames=withTiles; R.idx=Math.max(0,R.frames.length-4); R.ready=true;
  }catch(e){if(tok!==radarToken)return;R.fail=e.message||'unavailable';}
  if(radarOnScreen())render();   // BUG FIX: dashboard layout has no tabs, so it never refreshed after load
}
function drawRadar(){
  const cv=$('rcv'); if(!cv) return;
  const R=S.radar,ctx=cv.getContext('2d'),W=cv.width;
  const px=(tx,ty)=>[tx*256-R.xf*256+W/2, ty*256-R.yf*256+W/2];
  ctx.fillStyle='#0e1622';ctx.fillRect(0,0,W,W);
  R.base.forEach(({im,tx,ty})=>{const[x,y]=px(tx,ty);ctx.globalAlpha=1;ctx.drawImage(im,x,y,256,256);});
  const f=R.frames[R.idx];
  if(f)(R.tiles[f.time]||[]).forEach(({im,tx,ty})=>{const[x,y]=px(tx,ty);ctx.globalAlpha=.82;ctx.drawImage(im,x,y,256,256);});
  ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(W/2,W/2,8,0,7);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(W/2,W/2,3.5,0,7);ctx.fill();
  const ts=$('rts');
  if(ts&&f){const isFc=R.frames.indexOf(f)>=R.frames.filter(x=>x.time*1000<=Date.now()).length;
    ts.textContent=new Date(f.time*1000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+(isFc?' · forecast':'');}
  const sl=$('rsl'); if(sl) sl.value=R.idx;
}
const radarOnScreen=()=>S.tab==='radar'||S.wide;
setInterval(()=>{if(S.radar.playing&&S.radar.ready&&radarOnScreen()){S.radar.idx=(S.radar.idx+1)%S.radar.frames.length;drawRadar();}},700);

/* ================= RENDER ================= */
const fmtH=t=>new Date(t).toLocaleTimeString([],{hour:'numeric'});
const fmtD=t=>new Date(t+'T12:00').toLocaleDateString([],{weekday:'short'});
const fmtSun=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});

/* --- section builders (composable so wide layouts can show several at once) --- */
function secNow(wx,hours){
  const c=wx.current;
  return `
    <div class="hero"><div class="ic">${c.c.icon}</div><div class="big">${c.temp}°</div>
      <div class="cond">${c.c.text}</div>
      <div class="feels">Feels like ${c.feels}° · H:${wx.daily[0].hi}° L:${wx.daily[0].lo}°</div></div>
    <div class="grid">
      <div class="card"><div class="k">Wind</div><div class="v">${c.wind} mph</div></div>
      <div class="card"><div class="k">Humidity</div><div class="v">${c.hum}%</div></div>
      <div class="card"><div class="k">UV index</div><div class="v">${(+c.uv).toFixed(1)}</div><div class="s">${c.uv<3?'Low':c.uv<6?'Moderate':c.uv<8?'High':'Very high'}</div></div>
      <div class="card"><div class="k">Sun</div><div class="v" style="font-size:14px">↑ ${fmtSun(wx.sunrise)}<br>↓ ${fmtSun(wx.sunset)}</div></div>
    </div>
    <div class="sect">Next hours</div>
    <div class="hstrip">${wx.hourly.slice(0,hours||12).map(hcell).join('')}</div>`;
}
const hcell=h=>`<div class="hcell"><div class="t">${fmtH(h.t)}</div><div class="i">${h.c.icon}</div><div class="d">${h.temp}°</div><div class="p">${h.p>5?h.p+'%':''}</div></div>`;
function secHourly(wx,wrap){
  return `<div class="sect">24-hour forecast</div>
    <div class="hstrip"${wrap?' style="flex-wrap:wrap;row-gap:9px"':''}>${wx.hourly.map(hcell).join('')}</div>`;
}
function secDaily(wx){
  const mn=Math.min(...wx.daily.map(d=>d.lo)),mx=Math.max(...wx.daily.map(d=>d.hi)),rng=Math.max(1,mx-mn);
  return `<div class="sect">10-day forecast</div>`+wx.daily.map((d,i)=>`
    <div class="day"><div>${i===0?'Today':fmtD(d.t)}${d.p>20?`<div class="pp">${d.p}%</div>`:''}</div><div>${d.c.icon}</div>
    <div class="lo">${d.lo}°</div>
    <div class="tbar"><i style="left:${(d.lo-mn)/rng*100}%;width:${Math.max(4,(d.hi-d.lo)/rng*100)}%"></i></div>
    <div class="hi">${d.hi}°</div></div>`).join('');
}
function secRadar(){
  const R=S.radar;
  return `<div class="sect">Precipitation radar</div>
    <div class="radarbox">
      ${R.ready?`<canvas id="rcv" width="512" height="512"></canvas>
      <div class="rhud"><button id="rpl">${R.playing?'⏸':'▶'}</button>
      <input type="range" id="rsl" min="0" max="${R.frames.length-1}" value="${R.idx}">
      <div class="ts" id="rts"></div></div>`
      :`<div class="rstatus">${R.fail?'Radar unavailable: '+R.fail+'<br><small>Retrying on next refresh</small>':'Loading radar tiles…'}</div>`}
    </div>
    ${R.ready?`<div class="legend">light <i style="background:#7fd4ff"></i><i style="background:#4a90d9"></i><i style="background:#5cdb95"></i><i style="background:#f2c14e"></i><i style="background:#e4572e"></i><i style="background:#b03be4"></i> heavy</div>`:''}`;
}
function wireRadar(){
  const R=S.radar; if(!R.ready||!$('rcv')) return;
  drawRadar();
  $('rpl').onclick=()=>{R.playing=!R.playing;$('rpl').textContent=R.playing?'⏸':'▶';};
  $('rsl').oninput=e=>{R.playing=false;$('rpl').textContent='▶';R.idx=+e.target.value;drawRadar();};
}
const footer=wx=>`<div class="note">Updated ${new Date(wx.updated).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}${wx.fromCache?' · cached':''} · v${VERSION}</div>`;

function render(){
  const wx=S.wx; if(!wx) return;
  $('locName').textContent='📍 '+wx.location+' ▾';
  $('alertSlot').innerHTML=S.alerts.length?`<div class="alert"><b>⚠ ${S.alerts[0].event}</b>${(S.alerts[0].head||'').slice(0,120)}</div>`:'';
  const B=$('body');

  // WIDE (Fold inner display, ~600px+): no tabs — everything visible at once in two columns
  if(S.wide){
    $('tabs').innerHTML='';
    B.innerHTML=`<div class="dash">
        <div class="col">${secNow(wx,12)}${footer(wx)}</div>
        <div class="col">${secHourly(wx,true)}${secDaily(wx)}</div>
        <div class="col">${secRadar()}</div>
      </div>`;
    wireRadar();
    return;
  }

  $('tabs').innerHTML=[['now','🌡️','Now'],['hourly','🕐','Hourly'],['daily','📅','10-Day'],['radar','🛰️','Radar']]
    .map(([id,ic,lb])=>`<button class="${S.tab===id?'on':''}" data-t="${id}"><span class="ic">${ic}</span>${lb}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render();});

  if(S.tab==='now')         B.innerHTML=secNow(wx,12)+footer(wx);
  else if(S.tab==='hourly') B.innerHTML=secHourly(wx,true);
  else if(S.tab==='daily')  B.innerHTML=secDaily(wx);
  else if(S.tab==='radar'){ B.innerHTML=secRadar(); wireRadar(); }
}

/* ================= FLOW ================= */
async function loadFor(L,force){
  const key=`wx:${L.lat.toFixed(3)},${L.lon.toFixed(3)}`;
  if(force) mem.delete(key);
  try{
    S.wx=await fetchWeather(L.lat,L.lon,L.name);
    $('offlineBar').style.display='none';
  }catch(e){
    const saved=store.get('last:'+key,null);
    if(saved){S.wx={...saved,location:L.name,fromCache:true};$('offlineBar').style.display='block';}
    else throw e;
  }
  render();
  fetchAlerts(L.lat,L.lon).then(a=>{S.alerts=a;render();});
  loadRadar(L.lat,L.lon);
}
async function switchLocation(id){
  S.sel=id; const L=S.locations.find(l=>l.id===id);
  if(L&&L.lat!=null) await loadFor(L);
}
function removeLocation(id){
  S.locations=S.locations.filter(l=>l.id!==id);
  store.set('locs',S.locations);
  if(S.sel===id){
    const next=S.locations.find(l=>l.lat!=null)||S.locations[0];
    if(next&&next.lat!=null) switchLocation(next.id); else {S.sel=next?next.id:null;render();}
  } else render();
  renderLocList();
}

/* ================= LOCATIONS SHEET ================= */
function openSheet(focus){$('sheet').hidden=false;renderLocList();if(focus)$('searchInput').focus();}
function closeSheet(){$('sheet').hidden=true;$('searchInput').value='';suggList=[];renderSugg();}
$('locBtn').onclick=()=>openSheet(false);
$('btnSearch').onclick=()=>openSheet(true);
$('sheetClose').onclick=closeSheet;

function renderLocList(){
  if($('sheet').hidden) return;
  $('locList').innerHTML=S.locations.map(l=>{
    const key=l.lat!=null?`wx:${l.lat.toFixed(3)},${l.lon.toFixed(3)}`:null;
    const w=key?(cget(key)||store.get('last:'+key,null)):null;
    const wxCell=l.lat==null?'<span style="font-size:11px">tap to locate</span>'
      :w?`<span>${w.current.c.icon}</span><span>${w.current.temp}°</span>`:'<span>…</span>';
    return `<div class="locrow ${l.id===S.sel?'sel':''}" data-id="${l.id}">
      <div class="nm"><b>${l.isGPS?'◉ ':''}${l.name}</b><span>${l.isGPS?'Current location':''}</span></div>
      <div class="wx">${wxCell}</div>
      ${l.isGPS?'':`<button class="del" data-del="${l.id}">✕</button>`}</div>`;
  }).join('');
  $('locList').querySelectorAll('.locrow').forEach(r=>r.onclick=async e=>{
    if(e.target.dataset.del){removeLocation(e.target.dataset.del);return;}
    const L=S.locations.find(l=>l.id===r.dataset.id);
    if(L&&L.lat==null&&L.isGPS){closeSheet();boot();return;}   // GPS retry
    closeSheet(); await switchLocation(r.dataset.id);
  });
  // lazily fill missing temps, then refresh the list once
  const missing=S.locations.filter(l=>l.lat!=null&&!cget(`wx:${l.lat.toFixed(3)},${l.lon.toFixed(3)}`)&&!store.get(`last:wx:${l.lat.toFixed(3)},${l.lon.toFixed(3)}`,null));
  if(missing.length) Promise.allSettled(missing.map(l=>fetchWeather(l.lat,l.lon,l.name))).then(renderLocList);
}

/* ================= SEARCH ================= */
let suggList=[],suggTimer=null,suggSeq=0;
function renderSugg(){
  const q=$('searchInput').value.trim();
  $('suggBox').innerHTML=suggList.length
    ?suggList.map((s,i)=>`<div class="it" data-i="${i}"><span>${s.name}</span><span class="sub">${s.sub}</span></div>`).join('')
    :(q.length>=2?'<div class="none">No matches — check spelling</div>':'');
  $('suggBox').querySelectorAll('.it').forEach(el=>el.onclick=()=>pickSugg(+el.dataset.i));
}
async function pickSugg(i){
  const g=suggList[i]; if(!g) return;
  suggList=[];renderSugg();$('searchInput').value='';
  // dedupe: if this city is already saved, just switch to it
  const dup=S.locations.find(l=>l.lat!=null&&Math.abs(l.lat-g.lat)<0.05&&Math.abs(l.lon-g.lon)<0.05);
  closeSheet();
  if(dup){await switchLocation(dup.id);return;}
  const id='loc'+Date.now();
  S.locations.push({id,name:g.name,lat:g.lat,lon:g.lon});
  store.set('locs',S.locations);
  await switchLocation(id);
}
$('searchInput').addEventListener('input',()=>{
  const q=$('searchInput').value.trim();
  clearTimeout(suggTimer);
  if(q.length<2){suggList=[];renderSugg();return;}
  const seq=++suggSeq;
  suggTimer=setTimeout(async()=>{
    let r=[];try{r=await suggest(q);}catch(e){}
    if(seq!==suggSeq) return;         // stale response — a newer keystroke superseded it
    suggList=r;renderSugg();
  },250);
});
// BUG FIX: Add/Enter used to require suggestions to have ALREADY arrived (silent no-op
// if you typed fast). Now it fetches suggestions itself when the list is empty.
async function addLocation(){
  if(suggList.length){pickSugg(0);return;}
  const q=$('searchInput').value.trim(); if(q.length<2) return;
  $('searchGo').textContent='…';
  try{suggList=await suggest(q);}catch(e){suggList=[];}
  $('searchGo').textContent='Add';
  if(suggList.length)pickSugg(0); else renderSugg();
}
$('searchGo').onclick=addLocation;
$('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')addLocation();});
$('btnRefresh').onclick=()=>{const L=S.locations.find(l=>l.id===S.sel);if(L)loadFor(L,true);};

function boot(){
  const go=(lat,lon,nm)=>{Object.assign(S.locations[0],{lat,lon,name:nm});store.set('locs',S.locations);
    loadFor(S.locations[0]).then(()=>$('loading').style.display='none')
      .catch(e=>$('loadMsg').textContent='Could not load: '+e.message);};
  let done=false;
  const fallback=()=>{if(done)return;done=true;
    const saved=S.locations[0].lat!=null?S.locations[0]:null;
    if(saved)go(saved.lat,saved.lon,saved.name); else go(41.8781,-87.6298,'Chicago');};
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(async p=>{
      if(done)return;done=true;
      let nm='My Location';
      try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${p.coords.latitude}&lon=${p.coords.longitude}&format=json&zoom=14`);
        const a=(await r.json()).address||{};
        // unincorporated areas have no "city" — try local names before falling back to county
        nm=a.city||a.town||a.village||a.hamlet||a.suburb||a.locality||a.municipality||a.county||nm;}catch(e){}
      go(p.coords.latitude,p.coords.longitude,nm);
    },fallback,{timeout:8000,maximumAge:3e5});
    setTimeout(fallback,8500);
  }else fallback();
}
boot();
setInterval(()=>{const L=S.locations.find(l=>l.id===S.sel);if(L&&L.lat!=null)loadFor(L);},6e5);   // 10-min auto refresh
document.addEventListener('visibilitychange',()=>{                                                // refresh stale data on reopen
  if(!document.hidden&&S.wx&&Date.now()-S.wx.updated>6e5){const L=S.locations.find(l=>l.id===S.sel);if(L)loadFor(L);}});

/* ================= SWIPE NAVIGATION (phone layout) ================= */
const TABS=['now','hourly','daily','radar'];
const tabsVisible=()=>!S.wide&&getComputedStyle($('tabs')).display!=='none';
let swX=0,swY=0,swOn=false;
$('body').addEventListener('touchstart',e=>{
  swOn=false;
  if(!tabsVisible()) return;
  // don't hijack things that scroll or scrub horizontally themselves
  const strip=e.target.closest('.hstrip');
  if(strip&&strip.scrollWidth>strip.clientWidth+4) return;
  if(e.target.closest('.radarbox,input,.sugg')) return;
  const t=e.touches[0];swX=t.clientX;swY=t.clientY;swOn=true;
},{passive:true});
$('body').addEventListener('touchend',e=>{
  if(!swOn) return; swOn=false;
  const t=e.changedTouches[0],dx=t.clientX-swX,dy=t.clientY-swY;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5) return;   // must be a clear horizontal swipe
  const i=TABS.indexOf(S.tab),n=i+(dx<0?1:-1);
  if(n<0||n>=TABS.length) return;
  S.tab=TABS[n];render();
  const B=$('body');B.style.animation='none';void B.offsetHeight;B.style.animation=`slide${dx<0?'L':'R'} .22s ease`;
},{passive:true});

/* ================= ON-DEVICE DIAGNOSTICS ================= */
// Open by tapping the version line in the Now tab footer.
document.addEventListener('click',e=>{if(e.target.closest('.note')){$('diag').hidden=false;}});
$('diagClose').onclick=()=>$('diag').hidden=true;
$('diagCopy').onclick=async()=>{
  const t=$('diagOut').textContent;
  try{await navigator.clipboard.writeText(t);$('diagCopy').textContent='Copied ✓';}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();$('diagCopy').textContent='Copied ✓';}
  setTimeout(()=>$('diagCopy').textContent='Copy report',1500);

async function timed(fn){const t0=performance.now();const v=await fn();return[Math.round(performance.now()-t0),v];}
$('diagRun').onclick=async()=>{
  const out=[];const P=s=>{out.push(s);$('diagOut').textContent=out.join('\n');};
  const L=S.locations.find(l=>l.id===S.sel&&l.lat!=null)||{lat:41.8781,lon:-87.6298,name:'Chicago(fallback)'};
  P(`SKYWARD DIAGNOSTICS v${VERSION} — ${new Date().toISOString()}`);
  P(`device: ${navigator.userAgent.slice(0,80)}`);
  const tabsHidden=getComputedStyle($('tabs')).display==='none';
  const mode=(window.innerWidth<340&&window.innerHeight<420)?'compact(flip-cover)':(window.innerWidth>=600&&window.innerHeight>=500)?'wide(fold-inner)':'phone';
  P(`viewport: ${window.innerWidth}×${window.innerHeight} · dpr ${window.devicePixelRatio} · layout: ${mode} · S.wide=${S.wide} · dash-css-applied: ${!!document.querySelector('.dash')&&getComputedStyle(document.querySelector('.dash')).display==='grid'} · tabs-hidden: ${tabsHidden} · online: ${navigator.onLine}`);
  P(`selected: ${L.name} (${L.lat.toFixed(3)},${L.lon.toFixed(3)}) · saved locations: ${S.locations.length}`);
  P(`weather age: ${S.wx?Math.round((Date.now()-S.wx.updated)/6e4)+' min':'no data'} · alerts: ${Array.isArray(S.alerts)?S.alerts.length:'—'}`);
  // service worker
  try{const reg=await navigator.serviceWorker.getRegistration();
    P(`sw: ${navigator.serviceWorker.controller?'✓ controlling':'✗ not controlling'} · ${reg?.active?new URL(reg.active.scriptURL).search||'(no ?v)':'none'}`);
  }catch(e){P('sw: ✗ '+e.message);}
  // geolocation permission
  try{const st=await navigator.permissions.query({name:'geolocation'});P(`geolocation permission: ${st.state==='granted'?'✓':'✗'} ${st.state}`);}
  catch(e){P('geolocation permission: ? unsupported');}
  // API probes
  try{const[ms,r]=await timed(()=>fetch(`https://api.open-meteo.com/v1/forecast?latitude=${L.lat}&longitude=${L.lon}&current=temperature_2m`));
    P(`open-meteo: ${r.ok?'✓':'✗'} ${r.status} · ${ms}ms`);}catch(e){P('open-meteo: ✗ '+e.message);}
  try{const[ms,r]=await timed(()=>suggest('Denver'));P(`geocoding: ${r.length?'✓':'✗'} ${r.length} results · ${ms}ms`);}catch(e){P('geocoding: ✗ '+e.message);}
  try{const[ms,r]=await timed(()=>fetch(`https://api.weather.gov/alerts/active?point=${L.lat.toFixed(4)},${L.lon.toFixed(4)}`,{headers:{Accept:'application/geo+json'}}));
    P(`noaa alerts: ${r.ok?'✓':'✗'} ${r.status} · ${ms}ms`);}catch(e){P('noaa alerts: ✗ '+e.message);}
  // radar freshness — catches the stale-metadata bug
  try{const[ms,meta]=await timed(async()=>(await fetch('https://api.rainviewer.com/public/weather-maps.json')).json());
    const past=meta.radar?.past||[];const newest=past.length?past[past.length-1].time:0;
    const age=newest?Math.round((Date.now()/1000-newest)/60):-1;
    P(`rainviewer meta: ${past.length?'✓':'✗'} ${past.length} past frames · newest ${age} min old ${age>25?'✗ STALE':'✓'} · ${ms}ms`);
    if(past.length){const f=past[past.length-1];const{xf,yf}=mercator(L.lat,L.lon,7);
      const[tms,tr]=await timed(()=>fetch(`${meta.host}${f.path}/256/7/${Math.floor(xf)}/${Math.floor(yf)}/4/1_1.png`));
      P(`radar tile (past): ${tr.ok?'✓':'✗'} ${tr.status} · ${tms}ms`);}
    const nc=meta.radar?.nowcast||[];
    if(nc.length){const f=nc[0];const{xf,yf}=mercator(L.lat,L.lon,7);
      const[nms,nr]=await timed(()=>fetch(`${meta.host}${f.path}/256/7/${Math.floor(xf)}/${Math.floor(yf)}/4/1_1.png`));
      P(`radar tile (nowcast): ${nr.ok?'✓':'✗'} ${nr.status} · ${nms}ms · path=${f.path.slice(0,40)}`);}
    else P('radar nowcast: ✗ no nowcast frames in metadata');
  }catch(e){P('rainviewer: ✗ '+e.message);}
  try{const{xf,yf}=mercator(L.lat,L.lon,7);
    const[ms,r]=await timed(()=>fetch(`https://basemaps.cartocdn.com/dark_all/7/${Math.floor(xf)}/${Math.floor(yf)}.png`));
    P(`basemap tile: ${r.ok?'✓':'✗'} ${r.status} · ${ms}ms`);}catch(e){P('basemap: ✗ '+e.message);}
  // app radar state
  P(`radar state: ready=${S.radar.ready} · frames=${S.radar.frames.length} · fail='${S.radar.fail}'`);
  // caches
  try{const ks=(await caches.keys()).filter(k=>k.startsWith('skyward'));
    for(const k of ks){const n=(await (await caches.open(k)).keys()).length;P(`cache ${k}: ${n} entries`);}
    if(!ks.length)P('caches: ✗ none (service worker not installed?)');
  }catch(e){P('caches: ✗ '+e.message);}
  P('— end of report —');
};
// BUG FIX: cover state was computed once at load, so flipping the phone
// mid-session never re-rendered. Now it tracks resize/flip transitions live.
// Three layouts, driven purely by width so it survives any device:
//   <340px  compact  — Flip cover screen (~277px)
//   340-599 phone    — Flip main (360), Fold 8 cover (~475 @ dpr 2.625), normal phones
//   >=600px wide     — Fold 8 inner display (measured 932x616 @ dpr 2.625): dashboard
function layoutCheck(){
  const w=window.innerWidth, hgt=window.innerHeight;
  // compact = narrow AND short (Flip cover is ~277x288, near-square); a 320px-wide phone is tall, so it stays in phone layout
  const cover=w<340&&hgt<420;
  // wide = wide AND tall enough (Fold inner is 816x616); a phone in landscape (~800x360) stays in phone layout
  const wide=w>=600&&hgt>=500;
  const changed=(wide!==S.wide);
  S.wide=wide;
  if(cover&&S.tab!=='now')S.tab='now';            // compact locks to Now (tabs hidden)
  if(changed||cover){ if(S.wx)render(); }         // re-render across a fold/unfold transition
  return {cover,wide};
}
layoutCheck();
let rsz;window.addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(layoutCheck,150);});

if('serviceWorker' in navigator){
  // ?v= forces the browser to fetch the new worker whenever the version bumps,
  // and the reload below activates it in one relaunch instead of two
  navigator.serviceWorker.register('sw.js?v='+VERSION).then(r=>r.update()).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!reloaded){reloaded=true;location.reload();}
  });
}
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBtn').style.display='block';});
$('installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('installBtn').style.display='none';};
</script>
